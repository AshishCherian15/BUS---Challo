<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Bus Timings</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="in"><span class="brand"><span class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4M8 14h.01M16 14h.01"/></svg></span>Bus Timings Admin</span><span id="who" class="row"></span></div></header>
<main id="app" class="wrap wide page"></main>
<div id="modal" class="modal"></div>
<div id="sheet" class="sheet"></div>
<script>
const A=document.getElementById('app'),$=id=>document.getElementById(id);
let S,tab='stops',dirty=false,edit=null,fq='';
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const slugify=n=>n.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();
const nm=id=>(S.stops.find(s=>s.id===id)||{name:'?'}).name;
const link=id=>location.origin+'/s/'+encodeURIComponent(id);
const touch=()=>{dirty=true;$('savebar')&&$('savebar').classList.remove('hide')};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();return''}};
const sorted=a=>[...a].sort((x,y)=>x.name.localeCompare(y.name));

async function init(){const r=await fetch('/api/me');if(r.ok){await loadData();shell()}else loginView()}
async function loadData(){S=await (await fetch('/api/data',{cache:'no-store'})).json()}
function loginView(msg=''){$('who').innerHTML='';A.innerHTML=`<div class="card login"><h1 class="title" style="font-size:24px">Admin sign in</h1><p class="sub" style="margin-top:4px">Manage stops, buses and timings.</p>
 <input id="pw" type="password" class="input mt" style="width:100%" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
 <p id="lerr" class="err">${E(msg)}</p><button class="btn btn-p" style="width:100%" onclick="login()">Sign in</button></div>`;$('pw').focus()}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
 if(r.ok){await loadData();shell()}else $('lerr').textContent=(await r.json()).error||'Sign in failed.'}
async function logout(){if(dirty&&!confirm('You have unsaved changes. Sign out anyway?'))return;dirty=false;await fetch('/api/logout');loginView()}
async function save(){const b=$('savebtn');b.disabled=true;b.textContent='Saving…';
 const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
 if(r.status===401){loginView('Session expired. Sign in again.');return}
 if(r.ok){dirty=false;$('savebar').classList.add('hide')}else alert((await r.json()).error||'Save failed.');
 b.disabled=false;b.textContent='Save changes'}

function shell(){
 $('who').innerHTML=`<a class="btn btn-s btn-sm" href="/" target="_blank">View site</a><button class="btn btn-s btn-sm" onclick="logout()">Sign out</button>`;
 A.innerHTML=`<p class="sub">${S.stops.length} stops · ${S.buses.length} buses · ${S.trips.length} trips</p>
 <nav class="tabs">${[['stops','Stops'],['buses','Buses'],['trips','Trips & times']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';shell()">${l}</button>`).join('')}</nav>
 <div id="body" class="mt2"></div>
 <div id="savebar" class="bar ${dirty?'':'hide'}"><div class="in"><span class="sub">You have unsaved changes.</span><button id="savebtn" class="btn btn-p" onclick="save()">Save changes</button></div></div>`;
 ({stops:stopsView,buses:busesView,trips:tripsView})[tab]()}

/* Stops */
function stopsView(){$('body').innerHTML=`<section class="card"><h2>Add stops</h2><p class="sub">Paste one stop name per line. Duplicates are skipped. Renaming a stop never changes its link.</p>
 <textarea id="bulk" rows="4" class="input mt" placeholder="Neermarga&#10;Kalpane&#10;Nanthoor"></textarea><button class="btn btn-p mt" onclick="addStops()">Add stops</button></section>
 <div class="row mt2"><input id="sf" class="input grow" value="${E(fq)}" oninput="fq=this.value;drawStops()" placeholder="Search stops"><button class="btn btn-s" onclick="qrSheet()">Print all QR codes</button></div><div id="sl" class="mt"></div>`;drawStops()}
function drawStops(){const l=sorted(S.stops.filter(s=>s.name.toLowerCase().includes(fq.toLowerCase())));
 $('sl').innerHTML=l.length?`<ul class="list">${l.map(s=>`<li class="arow"><div class="main"><input class="input" value="${E(s.name)}" onchange="renameStop('${s.id}',this.value)" aria-label="Stop name"><p class="slug">/s/${E(s.id)}</p></div>
 <div class="acts"><button class="btn btn-s btn-sm" onclick="showQR('${s.id}')">QR</button><button class="btn btn-s btn-sm" onclick="copyLink('${s.id}',this)">Copy link</button><button class="btn btn-d btn-sm" onclick="delStop('${s.id}')">Delete</button></div></li>`).join('')}</ul>`:'<div class="empty"><b>No stops yet</b><p>Paste stop names above to add them.</p></div>'}
function copyLink(id,b){const t=link(id);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>prompt('Copy this link:',t));b.textContent='Copied';setTimeout(()=>b.textContent='Copy link',1200)}
function addStops(){let n=0;$('bulk').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(name=>{
 if(S.stops.some(s=>s.name.toLowerCase()===name.toLowerCase()))return;let id=slugify(name);while(S.stops.some(s=>s.id===id))id+='-'+uid().slice(0,3);S.stops.push({id,name});n++});
 if(n)touch();shell()}
function renameStop(id,v){v=v.trim();if(!v)return drawStops();S.stops.find(s=>s.id===id).name=v;touch()}
function delStop(id){const used=S.trips.filter(t=>t.stops.some(e=>e.stopId===id)).length;
 if(!confirm(`Delete "${nm(id)}"?`+(used?` It will also be removed from ${used} trip(s).`:'')))return;
 S.stops=S.stops.filter(s=>s.id!==id);S.trips.forEach(t=>t.stops=t.stops.filter(e=>e.stopId!==id));S.trips=S.trips.filter(t=>t.stops.length>=2);touch();shell()}

/* QR */
function loadQR(){return new Promise(res=>{if(window.QRCode)return res(true);
 const add=(src,fail)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res(true);s.onerror=fail;document.head.appendChild(s)};
 add('/qrcode.min.js',()=>add('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',()=>res(false)))})}
const noQR='<p class="sub">QR library could not load. Put qrcode.min.js in the public folder (see README) or check your internet.</p>';
async function makeQR(el,text,size){if(!await loadQR()){el.innerHTML=noQR;return}new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}
function showQR(id){const m=$('modal');m.classList.add('on');
 m.innerHTML=`<div class="box"><h3>${E(nm(id))}</h3><div id="qrbox" class="qbox"></div><p class="slug" style="white-space:normal;word-break:break-all">${E(link(id))}</p>
 <div class="row mt" style="justify-content:center"><button class="btn btn-p" onclick="dlQR('${id}')">Download PNG</button><button class="btn btn-s" onclick="$('modal').classList.remove('on')">Close</button></div></div>`;
 makeQR($('qrbox'),link(id),200)}
function dlQR(id){const c=$('qrbox').querySelector('canvas');if(!c)return alert('QR is not ready.');const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr-'+id+'.png';a.click()}
function qrSheet(){const s=$('sheet');s.classList.add('on');
 s.innerHTML=`<div class="row noprint"><button class="btn btn-p" onclick="print()">Print</button><button class="btn btn-s" onclick="$('sheet').classList.remove('on')">Close</button></div>
 <div class="qgrid">${sorted(S.stops).map(x=>`<div class="qc"><b>${E(x.name)}</b><small>Scan for bus timings</small><div class="q" id="q-${x.id}"></div></div>`).join('')}</div>`;
 S.stops.forEach(x=>makeQR($('q-'+x.id),link(x.id),140))}

/* Buses */
function busesView(){$('body').innerHTML=`<section class="card"><h2>Add bus</h2><div class="row mt"><input id="bn" class="input grow" placeholder="Bus name (e.g. Sabari)"><input id="br" class="input grow" placeholder="Registration (e.g. KA 19 D 7354)"><button class="btn btn-p" onclick="addBus()">Add bus</button></div></section>
 <ul class="list mt2">${S.buses.map(b=>`<li class="arow"><input class="input grow" value="${E(b.name)}" onchange="editBus('${b.id}','name',this.value)" aria-label="Bus name"><input class="input grow" value="${E(b.reg||'')}" onchange="editBus('${b.id}','reg',this.value)" aria-label="Registration"><button class="btn btn-d btn-sm" onclick="delBus('${b.id}')">Delete</button></li>`).join('')||'<li class="arow sub">No buses yet.</li>'}</ul>`}
function addBus(){const name=$('bn').value.trim();if(!name)return alert('Enter a bus name.');S.buses.push({id:'b'+uid(),name,reg:$('br').value.trim()});touch();shell()}
function editBus(id,k,v){if(k==='name'&&!v.trim())return busesView();S.buses.find(x=>x.id===id)[k]=v.trim();touch()}
function delBus(id){const n=S.trips.filter(t=>t.busId===id).length;if(!confirm('Delete this bus'+(n?` and its ${n} trip(s)`:'')+'?'))return;S.buses=S.buses.filter(b=>b.id!==id);S.trips=S.trips.filter(t=>t.busId!==id);touch();shell()}

/* Trips */
function newEdit(){edit={id:null,busId:S.buses[0]?.id||'',rows:[{name:'',time:''},{name:'',time:''}]}}
function tripsView(){if(!edit)newEdit();
 $('body').innerHTML=`<datalist id="sdl">${S.stops.map(s=>`<option value="${E(s.name)}">`).join('')}</datalist>
 <section class="card"><h2>${edit.id?'Edit trip':'New trip'}</h2><p class="sub">A trip is one run of a bus. List each stop in order with the time the bus arrives there.</p>
 <select class="input mt" style="width:100%" onchange="edit.busId=this.value">${S.buses.map(b=>`<option value="${b.id}" ${b.id===edit.busId?'selected':''}>${E(b.name)} ${E(b.reg||'')}</option>`).join('')||'<option value="">Add a bus first</option>'}</select>
 ${edit.rows.map((r,i)=>`<div class="tr"><span class="n">${i+1}</span><input list="sdl" class="input" value="${E(r.name)}" onchange="edit.rows[${i}].name=this.value" placeholder="Stop name"><input type="time" class="input" value="${r.time}" onchange="edit.rows[${i}].time=this.value"><button class="btn btn-d x" aria-label="Remove row" onclick="edit.rows.splice(${i},1);tripsView()">✕</button></div>`).join('')}
 <div class="row mt"><button class="btn btn-s" onclick="edit.rows.push({name:'',time:''});tripsView()">Add stop row</button><button class="btn btn-p" onclick="saveTrip()">${edit.id?'Update trip':'Add trip'}</button><button class="btn btn-s" onclick="newEdit();tripsView()">Clear</button></div>
 <details class="mt2"><summary>Paste many rows at once</summary><textarea id="paste" rows="5" class="input mt" placeholder="One per line: stop name, time&#10;Statbank, 07:40&#10;Nanthoor, 08:00&#10;Neermarga, 08:20"></textarea><button class="btn btn-s mt" onclick="fillRows()">Fill rows from text</button></details></section>
 <h2 class="sec-title" style="margin-top:26px">All trips</h2>${tripList()}`}
function fillRows(){const rows=$('paste').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf(',');return{name:l.slice(0,i).trim(),time:l.slice(i+1).trim().replace(/^(\d):/,'0$1:')}});if(rows.length)edit.rows=rows;tripsView()}
function saveTrip(){const rows=edit.rows.filter(r=>r.name.trim()||r.time);
 if(!edit.busId)return alert('Add a bus first (Buses tab).');
 if(rows.length<2)return alert('A trip needs at least two stops.');
 const out=[],bad=[];
 rows.forEach((r,i)=>{const s=S.stops.find(s=>s.name.toLowerCase()===r.name.trim().toLowerCase());
  if(!s)bad.push(`Row ${i+1}: stop "${r.name}" not found`);else if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(r.time))bad.push(`Row ${i+1}: time missing or invalid`);else out.push({stopId:s.id,time:r.time})});
 if(bad.length)return alert(bad.join('\n')+'\n\nAdd missing stops in the Stops tab first.');
 for(let i=1;i<out.length;i++)if(out[i].time<out[i-1].time)return alert(`Times must increase along the trip (row ${i+1} is earlier than row ${i}).`);
 if(edit.id){const t=S.trips.find(t=>t.id===edit.id);t.busId=edit.busId;t.stops=out}else S.trips.push({id:'t'+uid(),busId:edit.busId,stops:out});
 touch();newEdit();shell()}
function tripList(){return S.buses.map(b=>{const ts=S.trips.filter(t=>t.busId===b.id).sort((x,y)=>x.stops[0].time.localeCompare(y.stops[0].time));
 return `<h3 class="sec-title">${E(b.name)} ${E(b.reg||'')} · ${ts.length} trips</h3><ul class="list">${ts.map(t=>{const f=t.stops[0],l=t.stops[t.stops.length-1];
 return `<li class="arow"><div class="main" style="font-size:15px"><b>${E(nm(f.stopId))}</b> ${f.time} → <b>${E(nm(l.stopId))}</b> ${l.time}<p class="slug">${t.stops.length} stops</p></div>
 <div class="acts"><button class="btn btn-s btn-sm" onclick="editTrip('${t.id}',false)">Edit</button><button class="btn btn-s btn-sm" onclick="editTrip('${t.id}',true)">Duplicate</button><button class="btn btn-d btn-sm" onclick="delTrip('${t.id}')">Delete</button></div></li>`}).join('')||'<li class="arow sub">No trips for this bus.</li>'}</ul>`}).join('')}
function editTrip(id,dup){const t=S.trips.find(t=>t.id===id);edit={id:dup?null:id,busId:t.busId,rows:t.stops.map(e=>({name:nm(e.stopId),time:e.time}))};tripsView();scrollTo({top:0,behavior:'smooth'})}
function delTrip(id){if(!confirm('Delete this trip?'))return;S.trips=S.trips.filter(t=>t.id!==id);if(edit&&edit.id===id)newEdit();touch();tripsView()}
init();
</script></body></html>
