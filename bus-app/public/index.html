<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d6b">
<title>Bus Timings</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="in"><a class="brand" href="/" style="color:inherit"><span class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4M8 14h.01M16 14h.01"/></svg></span>Bus Timings</a><span class="sub">Live schedule</span></div></header>
<main id="app" class="wrap page"></main>
<script>
const app=document.getElementById('app');
let D=null,win=30,qs='';
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=s=>{const [h,m]=s.split(':');return +h*60+ +m};
const P=new URLSearchParams(location.search),pm=location.pathname.match(/^\/s\/([^/]+)/);
const slug=P.get('stop')||(pm&&decodeURIComponent(pm[1]));
function now(){if(P.get('time'))return mins(P.get('time'));
 const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
 return +p.find(x=>x.type==='hour').value%24*60+ +p.find(x=>x.type==='minute').value}
const hm=m=>{const h=Math.floor(m/60)%24;return [`${h%12||12}:${String(m%60).padStart(2,'0')}`,h<12?'AM':'PM']};
const eta=d=>d<=0?'Arriving now':d<60?`in ${d} min`:`in ${Math.floor(d/60)} h${d%60?' '+d%60+' min':''}`;
const wl=w=>w<60?w+' min':w/60+(w===60?' hour':' hours');
function arrivals(id){const bus=Object.fromEntries(D.buses.map(b=>[b.id,b])),nm=Object.fromEntries(D.stops.map(s=>[s.id,s.name])),out=[];
 D.trips.forEach(t=>t.stops.forEach((e,i)=>{if(e.stopId===id)out.push({m:mins(e.time),bus:bus[t.busId]||{name:'Bus',reg:''},to:i===t.stops.length-1?null:nm[t.stops[t.stops.length-1].stopId]})}));
 return out.sort((a,b)=>a.m-b.m)}
const card=(a,n,first)=>{const d=a.m-n,[t,ap]=hm(a.m);
 return `<article class="bus${first?' first':''}"><div class="tm"><b>${t}</b><span>${ap}</span></div>
 <div class="info"><span class="badge${d<=2?' soon':''}">${eta(d)}</span>
 <div class="nm">${E(a.bus.name)} ${a.bus.reg?`<span>${E(a.bus.reg)}</span>`:''}</div>
 <div class="to">${a.to?'Towards '+E(a.to):'Ends at this stop'}</div></div></article>`};
const pin='<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const listHtml=l=>l.length?`<ul class="list">${l.map(s=>`<li><a class="item" href="/s/${encodeURIComponent(s.id)}"><span class="pin">${pin}</span><b>${E(s.name)}</b><span class="chev">&rsaquo;</span></a></li>`).join('')}</ul>`:`<div class="empty"><b>No stops found</b><p>Try a different spelling.</p></div>`;
const filt=()=>D.stops.filter(s=>s.name.toLowerCase().includes(qs.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
function home(){return `<h1 class="title">Find your bus stop</h1><p class="sub" style="margin-top:6px">See which buses arrive in the next few minutes.</p>
 <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" value="${E(qs)}" placeholder="Search bus stop" autocomplete="off"></div>
 <h2 class="sec-title">${D.stops.length} bus stops</h2><div id="list">${listHtml(filt())}</div>`}
function stopPage(s){
 const n=now(),all=arrivals(s.id),list=all.filter(a=>a.m>=n-2&&a.m<=n+win),later=all.filter(a=>a.m>n+win).slice(0,3),[t,ap]=hm(n);
 return `<a class="back" href="/">&lsaquo; All stops</a>
 <section class="hero"><small>Bus stop</small><h1>${E(s.name)}</h1><div class="now"><span class="dot"></span>Now <b>${t} ${ap}</b></div></section>
 <div class="seg" role="group" aria-label="Time range">${[30,60,120].map(w=>`<button data-w="${w}" class="${w===win?'on':''}">Next ${wl(w)}</button>`).join('')}</div>
 ${list.length?`<h2 class="sec-title">Arriving in the next ${wl(win)}</h2>`+list.map((a,i)=>card(a,n,i===0)).join(''):`<h2 class="sec-title">Next ${wl(win)}</h2><div class="empty"><b>No buses right now</b><p>${later.length?'The next buses are listed below.':'There are no more buses today.'}</p></div>`}
 ${later.length?`<h2 class="sec-title">Later today</h2>`+later.map(a=>card(a,n,false)).join(''):''}
 <p class="note">Scheduled times. Actual arrival may vary with traffic.</p>`}
function render(){
 if(!D)return app.innerHTML='<p class="sub" style="text-align:center;margin-top:80px">Loading…</p>';
 if(slug){const s=D.stops.find(x=>x.id===slug);
  app.innerHTML=s?stopPage(s):`<a class="back" href="/">&lsaquo; All stops</a><div class="empty"><b>Stop not found</b><p>This code may be out of date. Search for your stop instead.</p></div>`}
 else if(!document.getElementById('q'))app.innerHTML=home()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b){win=+b.dataset.w;render()}});
app.addEventListener('input',e=>{if(e.target.id==='q'){qs=e.target.value;document.getElementById('list').innerHTML=listHtml(filt())}});
async function load(){try{D=await (await fetch('/api/data',{cache:'no-store'})).json();render()}catch(e){if(!D)app.innerHTML='<div class="empty" style="margin-top:40px"><b>Could not load timings</b><p>Check your connection and refresh.</p></div>'}}
render();load();setInterval(render,20000);setInterval(load,60000);
</script></body></html>
